<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Editor · Dr. Radhika's Allergy &amp; Lung Clinic</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  /* Shown only if the editor fails to start. Without it a failure looks like a
     spinner that never stops, which tells nobody anything. */
  #diag{position:fixed;inset:0;z-index:99999;overflow:auto;background:#FDFBF7;
    color:#453F36;padding:32px 24px;line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #diag .in{max-width:46rem;margin:0 auto}
  #diag h2{font-family:Georgia,serif;font-weight:400;font-size:1.5rem;color:#26221B;margin:0 0 12px}
  #diag p{margin:0 0 14px}
  #diag pre{background:#26221B;color:#F3EEE4;padding:16px;border-radius:3px;
    font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;
    -webkit-user-select:text;user-select:text}
  #diag button{font:inherit;font-weight:500;background:#5B7150;color:#FDFBF7;
    border:none;border-radius:2px;padding:12px 22px;cursor:pointer}
  #cms-guide-fallback{position:fixed;right:18px;bottom:18px;z-index:99998;
    background:#5B7150;color:#FDFBF7;text-decoration:none;font-size:14px;
    font-weight:500;padding:10px 16px;border-radius:3px;
    box-shadow:0 2px 8px rgba(38,34,27,.22);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
</style>
<!-- Identity and the CMS are loaded only on this page. The public site makes no
     third-party request other than its webfonts, and the privacy notice says so. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  // Capture failures from the very first moment, before either third-party
  // script has run. Anything that arrives later is appended to the same log.
  window.__diag = [];
  window.addEventListener('error', function (e) {
    window.__diag.push('error: ' + (e.message || e.type) +
      (e.filename ? '\n  at ' + e.filename + ':' + e.lineno : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__diag.push('unhandled rejection: ' +
      (r && (r.stack || r.message) ? (r.stack || r.message) : String(r)));
  });
</script>
</head>
<body>

<script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
<script>
  (function () {
    // Decap draws its own "Login with Netlify Identity" screen and owns the
    // whole sign-in flow. This page must not put a second gate in front of it:
    // two competing logins, the second one reloading the page on success, is
    // what made signing in appear to loop back to the start.
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', function (user) {
        if (!user) {
          window.netlifyIdentity.on('login', function () {
            document.location.href = '/admin/';
          });
        }
      });
    }

    // A "How to use this editor" tab in the CMS's own navigation. Decap 3 has
    // no API for adding one -- registerAdditionalLink does not exist in this
    // version -- so the tab is a clone of one of Decap's own nav links. Cloning
    // inherits the styling without hard-coding class names, which are generated
    // afresh on every release. React re-renders the header when the route
    // changes and throws the clone away, so it is put back when that happens.
    var GUIDE_HREF = 'guide.html', GUIDE_LABEL = 'How to use';

    function addGuideTab() {
      if (document.getElementById('cms-guide-tab')) return true;

      var links = [], all = document.querySelectorAll('a[href^="#/"]');
      for (var i = 0; i < all.length; i++) {
        if (all[i].parentNode && all[i].parentNode.tagName === 'LI') links.push(all[i]);
      }
      if (!links.length) return false;

      // Clone a tab that is not the current one. Decap marks the selected tab
      // with aria-current and a header-link-active class; a clone of that one
      // would look permanently selected, which a link to a separate page is
      // not. Fall back to the first tab if every candidate is marked.
      var model = null;
      for (var j = 0; j < links.length; j++) {
        if (!links[j].hasAttribute('aria-current') &&
            links[j].className.indexOf('header-link-active') === -1) {
          model = links[j];
          break;
        }
      }
      if (!model) model = links[0];

      var item = model.parentNode.cloneNode(true);
      var a = item.querySelector('a');
      if (!a) return false;

      a.id = 'cms-guide-tab';
      a.removeAttribute('aria-current');
      a.className = a.className.replace(/\bheader-link-active\b/g, '').trim();
      a.setAttribute('href', GUIDE_HREF);
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener');

      // Keep Decap's icon wrapper for the spacing, but put our own glyph in
      // it: which tab got cloned depends on the route, and the tab should not
      // change its icon depending on where the editor happened to start.
      var icon = a.querySelector('span');
      if (icon) {
        icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="24" ' +
          'height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' +
          '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 ' +
          '8 8 0 0 1 0 16zm-1-5h2v2h-2v-2zm1.6-9.9c-1.9-.3-3.5.9-3.8 2.6h2c.1-.6.6-1 ' +
          '1.3-1 .7 0 1.2.4 1.2 1 0 .5-.2.8-.9 1.2-.9.6-1.4 1.1-1.4 2.4h2c0-.7.2-1 ' +
          '.9-1.4.9-.6 1.4-1.3 1.4-2.3 0-1.4-1.1-2.3-2.7-2.5z"/></svg>';
      }
      a.textContent = '';
      if (icon) a.appendChild(icon);
      a.appendChild(document.createTextNode(GUIDE_LABEL));

      model.parentNode.parentNode.appendChild(item);
      return true;
    }

    // Watch for the header being rebuilt. addGuideTab() is a no-op once the
    // tab is present, so the observer reacting to our own insertion is cheap.
    if (window.MutationObserver) {
      new MutationObserver(function () { addGuideTab(); })
        .observe(document.documentElement, { childList: true, subtree: true });
    }
    var guideTries = 0;
    var guideTimer = setInterval(function () {
      if (addGuideTab() || ++guideTries > 40) clearInterval(guideTimer);
    }, 500);

    // If the navigation never appears -- a Decap change, or the editor failing
    // to start -- the guide is still one click away.
    setTimeout(function () {
      if (document.getElementById('cms-guide-tab')) return;
      var a = document.createElement('a');
      a.id = 'cms-guide-fallback';
      a.href = GUIDE_HREF;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'How to use this editor';
      document.body.appendChild(a);
    }, 12000);

    // The editor loads its settings from config.yml next to this page. Probe it
    // directly so a missing or misserved file is named, rather than showing up
    // as a spinner that never resolves.
    var probe = 'not started';
    fetch('config.yml', { cache: 'no-store' }).then(function (r) {
      return r.text().then(function (body) {
        probe = 'HTTP ' + r.status +
          '\n  content-type: ' + (r.headers.get('content-type') || '(none)') +
          '\n  length: ' + body.length +
          '\n  begins: ' + JSON.stringify(body.slice(0, 70));
      });
    }).catch(function (err) {
      probe = 'fetch failed: ' + (err && err.message ? err.message : String(err));
    });

    function stuck() {
      var t = document.body.innerText || '';
      return t.indexOf('Loading configuration') !== -1 || t.trim() === '';
    }

    setTimeout(function () {
      if (!stuck() && !window.__diag.length) return;

      var report = [
        'page        : ' + location.href,
        'decap CMS   : ' + (window.CMS ? 'loaded' : 'DID NOT LOAD'),
        'identity    : ' + (window.netlifyIdentity ? 'loaded' : 'DID NOT LOAD'),
        'signed in   : ' + (window.netlifyIdentity && window.netlifyIdentity.currentUser()
                              ? 'yes' : 'no'),
        'config.yml  : ' + probe,
        '',
        window.__diag.length ? window.__diag.join('\n\n') : '(no JavaScript errors captured)'
      ].join('\n');

      var d = document.createElement('div');
      d.id = 'diag';
      d.innerHTML =
        '<div class="in"><h2>The editor did not finish starting</h2>' +
        '<p>Nothing is broken on the public website — this page only.</p>' +
        '<p>Please send the text below to whoever set this up; it says exactly ' +
        'what failed.</p><pre></pre>' +
        '<p style="margin-top:18px"><button type="button" ' +
        'onclick="location.reload()">Try again</button></p></div>';
      d.querySelector('pre').textContent = report;
      document.body.appendChild(d);
    }, 9000);
  })();
</script>
</body>
</html>
