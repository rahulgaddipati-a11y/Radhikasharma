<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Editor · Dr. Radhika's Allergy &amp; Lung Clinic</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#FDFBF7;color:#453F36}
  .gate{max-width:34rem;margin:12vh auto;padding:0 24px;line-height:1.6}
  .gate h1{font-family:Georgia,serif;font-weight:400;font-size:1.8rem;color:#26221B;margin:0 0 14px}
  .gate p{margin:0 0 14px}
  .gate button{font:inherit;font-weight:500;background:#5B7150;color:#FDFBF7;border:none;
    border-radius:2px;padding:12px 22px;cursor:pointer}
  .gate small{display:block;margin-top:28px;color:#6C6559;font-size:13px}
</style>
<!-- Identity and the CMS are loaded only on this page. The public site makes no
     third-party request other than its webfonts, and the privacy notice says so. -->
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<div class="gate" id="gate">
  <h1>Clinic editor</h1>
  <p>Sign in to write and edit articles for the Knowledge section.</p>
  <p><button type="button" id="login">Sign in</button></p>
  <small>
    Anything you save here is sent to Dr. Radhika for approval — it does not go
    on the live website until she publishes it.
  </small>
</div>

<script src="https://unpkg.com/decap-cms@^3.1.0/dist/decap-cms.js"></script>
<script>
  (function () {
    var gate = document.getElementById('gate');
    var identity = window.netlifyIdentity;
    if (!identity) return;

    document.getElementById('login').addEventListener('click', function () {
      identity.open('login');
    });

    identity.on('init', function (user) {
      if (user) gate.hidden = true;
    });
    identity.on('login', function () {
      gate.hidden = true;
      document.location.reload();
    });
    identity.on('logout', function () {
      gate.hidden = false;
    });
  })();
</script>
</body>
</html>
